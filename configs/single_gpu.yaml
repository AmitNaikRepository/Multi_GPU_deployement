# Model configuration - Single GPU setup
model:
  name: "Qwen/Qwen2.5-3B-Instruct"  
  max_seq_length: 2048  # Reduced for single GPU
  dtype: null
  load_in_4bit: true    # Use quantization for memory efficiency
  load_in_8bit: false

# LoRA configuration
lora:
  rank: 16              # Smaller rank for single GPU
  alpha: 16
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj" 
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  dropout: 0.0

# Dataset configuration
dataset:
  name: "synthetic"
  eval_dataset: null
  max_samples: 512      # Smaller dataset for development

# Training hyperparameters  
training:
  epochs: 2
  batch_size: 1
  target_batch_size: 16 # Smaller effective batch size
  learning_rate: 2e-4

# Additional settings
enable_thinking: false
save_model: true
